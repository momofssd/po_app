<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PO Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load PDF.js from CDN for browser-side PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Initialize PDF.js worker
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <script>
      // Theme: clean financial-services look - white surfaces, light grey page,
      // deep green primary, neutral greys, small corner radii, flat shadows.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                '"Source Sans 3"',
                '"Helvetica Neue"',
                "Helvetica",
                "Arial",
                "sans-serif",
              ],
            },
            colors: {
              brand: {
                bg: "#f4f4f4",
                card: "#ffffff",
                text: "#1e1e1e",
                subtext: "#5f6062",
                primary: "#2f7a2c",
                primaryHover: "#245f22",
                dark: "#262626",
                border: "#d4d4d4",
              },
              primary: {
                50: "#eef6ed",
                100: "#d7ebd5",
                200: "#afd6ab",
                300: "#80bc7b",
                400: "#55a050",
                500: "#3d8a38",
                600: "#2f7a2c",
                700: "#245f22",
                800: "#1d4b1b",
                900: "#153714",
              },
            },
            borderRadius: {
              // Flatter, squarer corners across all components
              lg: "4px",
              xl: "6px",
              "2xl": "8px",
              "3xl": "8px",
            },
            boxShadow: {
              brand: "0 1px 2px rgba(0, 0, 0, 0.06)",
              "brand-hover": "0 2px 8px rgba(0, 0, 0, 0.10)",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Source Sans 3", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
        background-color: #f4f4f4;
        color: #1e1e1e;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Smooth transitions for all interactive elements */
      button,
      a,
      input,
      select {
        transition-property:
          color, background-color, border-color, text-decoration-color, fill,
          stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      /* Primary action buttons render as pills */
      button.bg-brand-primary {
        border-radius: 9999px;
      }

      /* Visible keyboard focus in the brand green */
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #2f7a2c;
        outline-offset: 2px;
      }

      /* Crisp, light table chrome */
      table thead th {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",
          "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
